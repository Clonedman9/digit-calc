name: Import frontend refresh
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/quiet-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/import-frontend-refresh.py
      - run: node --test digit-calc/tests/*.test.cjs
      - name: Apply validated frontend
        run: |
          python3 - <<'PYCODE'
          import pathlib, shutil
          src = pathlib.Path('digit-calc')
          for relative in ['index.html', 'assets', 'README.md', 'tests', 'scripts/build-standalone.cjs', '.gitignore']:
              p = src / relative
              q = pathlib.Path(relative)
              if p.is_dir():
                  shutil.copytree(p, q, dirs_exist_ok=True)
              else:
                  q.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(p, q)
          PYCODE
          node --test tests/*.test.cjs
          node scripts/build-standalone.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets README.md tests scripts/build-standalone.cjs .gitignore
          git commit -m 'refactor: redesign all frontend views with quiet responsive workspace'
          git push origin HEAD:ui/quiet-workspace
