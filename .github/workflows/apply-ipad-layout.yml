name: Apply iPad centered layout
on:
  push:
    branches: ['ui/ipad-centered-keypad']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/apply-ipad-layout.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/app.css README.md tests/input.test.cjs tests/tablet-layout.test.cjs scripts/check-tablet-layout.py
          git commit -m 'feat: center tablet equation above one large shared keypad'
          git push origin HEAD:ui/ipad-centered-keypad
