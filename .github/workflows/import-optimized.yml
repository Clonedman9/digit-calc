name: Import optimized code
on:
  push:
    branches: ['perf/core-and-runtime']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/import-optimized.py
      - run: node --test .verified-source/tests/*.test.cjs
      - run: node .verified-source/scripts/build-standalone.cjs
      - name: Apply verified source
        run: |
          python3 - <<'PYCODE'
          import pathlib, shutil
          src = pathlib.Path('.verified-source')
          for p in src.rglob('*'):
              if not p.is_file():
                  continue
              q = pathlib.Path(p.relative_to(src))
              q.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(p, q)
          PYCODE
          node --test tests/*.test.cjs
          node scripts/build-standalone.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets README.md tests scripts/build-standalone.cjs scripts/benchmark.cjs scripts/browser-benchmark.js .gitignore
          git commit -m 'perf: optimize generation, analytics, persistence and bounded sessions'
          git push origin HEAD:perf/core-and-runtime
