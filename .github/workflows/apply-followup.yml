name: Apply adaptive follow-up
on:
  push:
    branches: ['fix/adaptive-range-review']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/apply-followup.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/core.js assets/app.js README.md tests/review-followup.test.cjs
          git commit -m 'fix: keep adaptive display monotonic and release old review nodes'
          git push origin HEAD:fix/adaptive-range-review
