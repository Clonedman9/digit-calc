<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>口算练习 · Math Drill</title>
<meta name="description" content="自定义算子与位数的口算练习：自动出算式，即时判分，统计正确率与速度。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✎</text></svg>">
<style>
  :root{
    --bg:#0b0f19;
    --bg-2:#101827;
    --card:#141c2e;
    --line:rgba(255,255,255,.08);
    --line-strong:rgba(255,255,255,.16);
    --text:#e8edf7;
    --muted:#8b97ae;
    --accent:#7c6cff;
    --accent-2:#22d3ee;
    --ok:#34d399;
    --bad:#fb7185;
    --warn:#fbbf24;
    --shadow:0 30px 80px -30px rgba(0,0,0,.9);
  }
  html[data-theme="light"]{
    --bg:#eef2f9; --bg-2:#e6ecf6; --card:#ffffff;
    --line:rgba(16,24,40,.08); --line-strong:rgba(16,24,40,.16);
    --text:#111a2b; --muted:#5d6b85;
    --shadow:0 30px 70px -40px rgba(30,45,80,.55);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0; min-height:100vh; color:var(--text); padding:26px 16px 48px;
    font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    background:
      radial-gradient(900px 520px at 10% -10%, rgba(124,108,255,.26), transparent 60%),
      radial-gradient(760px 460px at 96% 2%, rgba(34,211,238,.18), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg-2));
    display:flex; justify-content:center;
    transition:background .35s ease,color .35s ease;
  }
  .app{width:100%;max-width:560px}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
  .brand{display:flex;align-items:center;gap:12px;min-width:0}
  .logo{
    width:46px;height:46px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;
    font-size:22px;font-weight:700;color:#fff;
    background:linear-gradient(140deg,var(--accent),var(--accent-2));
    box-shadow:0 12px 30px -10px rgba(124,108,255,.8);
  }
  h1{font-size:19px;margin:0;letter-spacing:.3px}
  .brand p{margin:3px 0 0;font-size:12px;color:var(--muted)}
  .icon-btn{
    width:42px;height:42px;border-radius:13px;flex:0 0 auto;cursor:pointer;font-size:17px;
    border:1px solid var(--line-strong);background:var(--card);color:var(--text);
    transition:.2s;box-shadow:var(--shadow);
  }
  .icon-btn:hover{transform:translateY(-1px);border-color:var(--accent)}

  .view{display:none;animation:fade .28s ease}
  .view.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    padding:16px;margin-bottom:14px;box-shadow:var(--shadow);
  }
  .label{
    font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--muted);margin-bottom:10px;
  }

  /* 算子多选 */
  .chips{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .chip{
    padding:16px 0;border-radius:15px;cursor:pointer;font-size:21px;font-weight:600;
    border:1px solid var(--line-strong);background:transparent;color:var(--text);
    transition:.18s;font-family:inherit;position:relative;
  }
  .chip:hover{border-color:var(--accent);transform:translateY(-1px)}
  .chip.on{
    background:linear-gradient(140deg,var(--accent),var(--accent-2));
    border-color:transparent;color:#fff;
    box-shadow:0 14px 30px -14px rgba(124,108,255,.95);
  }
  .chip.on::after{
    content:"✓";position:absolute;top:5px;right:8px;font-size:10px;opacity:.85;
  }

  .setting{margin-bottom:18px}
  .setting:last-child{margin-bottom:0}
  .row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
  .row span{font-size:13px;color:var(--muted)}
  .row b{font-size:13px;font-variant-numeric:tabular-nums}
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;
    background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--line-strong) var(--p,50%));
    outline:none;cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;
    border:3px solid var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.35);cursor:grab;
  }
  input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--accent)}

  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px}
  .seg button{
    padding:11px 6px;border-radius:12px;cursor:pointer;font-size:13px;font-family:inherit;
    border:1px solid var(--line-strong);background:transparent;color:var(--muted);transition:.16s;
  }
  .seg button.on{border-color:var(--accent);color:var(--text);background:rgba(124,108,255,.13);font-weight:600}

  .btn{
    width:100%;padding:15px 18px;border-radius:16px;font-size:15px;font-weight:600;cursor:pointer;
    border:1px solid var(--line-strong);background:var(--card);color:var(--text);
    transition:.18s;font-family:inherit;
  }
  .btn:hover{transform:translateY(-1px)}
  .btn:active{transform:scale(.99)}
  .btn.primary{
    border-color:transparent;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 18px 36px -18px rgba(124,108,255,.95);
  }
  .btn.big{padding:17px;font-size:16px;letter-spacing:.5px}
  .btn.ghost{background:transparent;color:var(--muted)}
  .actions{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}

  .hint{font-size:12px;color:var(--muted);text-align:center;margin:12px 0 0;line-height:1.6}

  /* ---------- 练习中 ---------- */
  .topbar{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-bottom:10px}
  .topbar b{color:var(--text);font-variant-numeric:tabular-nums}
  .topbar .mid{font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,Consolas,monospace}
  .progress{height:5px;border-radius:999px;background:var(--line);overflow:hidden;margin-bottom:18px}
  .progress i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .35s ease}

  .qcard{
    position:relative;overflow:hidden;text-align:center;padding:30px 20px 24px;
    border-radius:24px;border:1px solid var(--line);margin-bottom:14px;
    background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.012));
    box-shadow:var(--shadow);transition:border-color .2s,box-shadow .2s;
  }
  html[data-theme="light"] .qcard{background:linear-gradient(160deg,#f8faff,#fff)}
  .qcard.good{border-color:rgba(52,211,153,.65);box-shadow:0 0 0 3px rgba(52,211,153,.16),var(--shadow)}
  .qcard.bad{border-color:rgba(251,113,133,.65);box-shadow:0 0 0 3px rgba(251,113,133,.16),var(--shadow)}
  .qno{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .q-expr{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:38px;font-weight:600;letter-spacing:.5px;line-height:1.2;
    word-break:break-all;margin-bottom:18px;
  }
  #answer{
    width:100%;max-width:340px;text-align:center;padding:14px 16px;border-radius:16px;
    border:2px solid var(--line-strong);background:rgba(0,0,0,.25);color:var(--text);
    font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:600;
    outline:none;transition:.18s;
  }
  html[data-theme="light"] #answer{background:#f4f6fc}
  #answer:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(124,108,255,.16)}
  #answer::placeholder{color:var(--muted);opacity:.5;font-weight:400}

  .feedback{min-height:26px;margin-top:14px;font-size:14.5px;font-weight:600;transition:.2s}
  .feedback.good{color:var(--ok)}
  .feedback.bad{color:var(--bad)}
  .feedback small{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:4px}

  .statline{display:flex;justify-content:space-around;margin-top:16px;font-size:12.5px;color:var(--muted)}
  .statline b{font-size:15px;font-variant-numeric:tabular-nums}
  .statline .g b{color:var(--ok)}
  .statline .r b{color:var(--bad)}

  /* ---------- 结算 ---------- */
  .score{
    text-align:center;padding:26px 18px 22px;border-radius:24px;margin-bottom:14px;
    border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);
  }
  .score .big{font-size:52px;font-weight:700;line-height:1.1;letter-spacing:-1px;
    background:linear-gradient(120deg,var(--text),var(--accent-2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .score .sub{font-size:13px;color:var(--muted);margin-top:6px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
  .kpi{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:12px}
  html[data-theme="light"] .kpi{background:#f6f8fd}
  .kpi span{display:block;font-size:11px;color:var(--muted);margin-bottom:5px}
  .kpi b{font-size:18px;font-variant-numeric:tabular-nums}

  .wrong-item{
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:11px 2px;border-bottom:1px dashed var(--line);font-size:13.5px;
    font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .wrong-item:last-child{border-bottom:0}
  .wrong-item .ai{color:var(--bad);text-decoration:line-through;opacity:.8}
  .wrong-item .co{color:var(--ok);font-weight:600}

  footer{text-align:center;font-size:11px;color:var(--muted);margin-top:22px;line-height:1.8}
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px dotted var(--line-strong)}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
    background:var(--text);color:var(--bg);padding:11px 20px;border-radius:999px;
    font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}

  @media (max-width:420px){
    .q-expr{font-size:28px}
    #answer{font-size:22px}
    .score .big{font-size:44px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">✎</div>
      <div>
        <h1>口算练习</h1>
        <p>自动出算式 · 作答判分 · 统计正确率</p>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" title="切换主题">🌙</button>
  </header>

  <!-- ============ 设置 ============ -->
  <section class="view active" id="setupView">
    <div class="card">
      <div class="label">选择算子（可多选）</div>
      <div class="chips" id="opChips">
        <button class="chip on" data-op="+">＋</button>
        <button class="chip on" data-op="−">－</button>
        <button class="chip on" data-op="×">×</button>
        <button class="chip" data-op="÷">÷</button>
      </div>
    </div>

    <div class="card">
      <div class="setting">
        <div class="row"><span>数字位数</span><b id="digitsVal">2 位</b></div>
        <input type="range" id="digits" min="1" max="6" value="2">
      </div>
      <div class="setting">
        <div class="row"><span>题目数量</span><b id="totalVal">10 题</b></div>
        <div class="seg" id="totalSeg">
          <button data-v="10" class="on">10 题</button>
          <button data-v="20">20 题</button>
          <button data-v="30">30 题</button>
          <button data-v="0">无限</button>
        </div>
      </div>
      <div class="setting">
        <div class="row"><span>每题限时</span><b id="limitVal">不限时</b></div>
        <div class="seg" id="limitSeg">
          <button data-v="0" class="on">不限</button>
          <button data-v="10">10 秒</button>
          <button data-v="20">20 秒</button>
          <button data-v="30">30 秒</button>
        </div>
      </div>
    </div>

    <button class="btn primary big" id="startBtn">开始练习</button>
    <p class="hint" id="hintText">出题规则：加减乘除均保证答案为整数，减法不被减数小于减数</p>
  </section>

  <!-- ============ 练习 ============ -->
  <section class="view" id="drillView">
    <div class="topbar">
      <span>第 <b id="progressText">1</b> 题</span>
      <span class="mid" id="timerText">0.0s</span>
      <span>连击 <b id="streakText">0</b></span>
    </div>
    <div class="progress"><i id="progressBar"></i></div>

    <div class="qcard" id="qcard">
      <div class="qno">请计算</div>
      <div class="q-expr" id="qExpr">—</div>
      <input id="answer" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" placeholder="输入答案">
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="actions">
      <button class="btn" id="skipBtn">跳过</button>
      <button class="btn primary" id="submitBtn">提交 (Enter)</button>
    </div>

    <div class="statline">
      <span class="g">正确 <b id="okCount">0</b></span>
      <span class="r">错误 <b id="badCount">0</b></span>
      <span>正确率 <b id="accText">—</b></span>
      <button class="btn ghost" id="quitBtn" style="width:auto;padding:0;border:0;font-size:12.5px;color:var(--muted)">结束</button>
    </div>
  </section>

  <!-- ============ 结算 ============ -->
  <section class="view" id="doneView">
    <div class="score">
      <div class="big" id="scoreBig">0%</div>
      <div class="sub" id="scoreSub">答对 0 / 10 题</div>
      <div class="grid2">
        <div class="kpi"><span>平均用时</span><b id="kpiAvg">—</b></div>
        <div class="kpi"><span>最长连击</span><b id="kpiStreak">0</b></div>
        <div class="kpi"><span>最快一题</span><b id="kpiFast">—</b></div>
        <div class="kpi"><span>总用时</span><b id="kpiTotal">—</b></div>
      </div>
    </div>

    <div class="card" id="wrongCard">
      <div class="label">错题回顾</div>
      <div id="wrongList"></div>
    </div>

    <div class="actions">
      <button class="btn" id="retryWrongBtn">重练错题</button>
      <button class="btn primary" id="againBtn">再来一轮</button>
    </div>
    <button class="btn ghost" id="backBtn" style="margin-top:12px">返回设置</button>
  </section>

  <footer>
    纯前端 · 无后端 · 数据只存在你自己的浏览器<br>
    <a href="https://github.com/Clonedman9/digit-calc" target="_blank" rel="noopener">GitHub</a>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };
  var els = {
    setup: $("setupView"), drill: $("drillView"), done: $("doneView"),
    opChips: $("opChips"), digits: $("digits"), digitsVal: $("digitsVal"),
    totalSeg: $("totalSeg"), totalVal: $("totalVal"),
    limitSeg: $("limitSeg"), limitVal: $("limitVal"),
    startBtn: $("startBtn"), hint: $("hintText"),
    progressText: $("progressText"), timerText: $("timerText"), streakText: $("streakText"),
    progressBar: $("progressBar"), qcard: $("qcard"), qExpr: $("qExpr"),
    answer: $("answer"), feedback: $("feedback"),
    skipBtn: $("skipBtn"), submitBtn: $("submitBtn"), quitBtn: $("quitBtn"),
    okCount: $("okCount"), badCount: $("badCount"), accText: $("accText"),
    scoreBig: $("scoreBig"), scoreSub: $("scoreSub"),
    kpiAvg: $("kpiAvg"), kpiStreak: $("kpiStreak"), kpiFast: $("kpiFast"), kpiTotal: $("kpiTotal"),
    wrongCard: $("wrongCard"), wrongList: $("wrongList"),
    retryWrongBtn: $("retryWrongBtn"), againBtn: $("againBtn"), backBtn: $("backBtn"),
    themeBtn: $("themeBtn"), toast: $("toast")
  };

  var S = {
    ops: ["+", "−", "×"],
    digits: 2,
    total: 10,
    limit: 0,
    // 一轮状态
    i: 0, ok: 0, bad: 0, streak: 0, maxStreak: 0,
    times: [], wrong: [], queue: null,
    cur: null, locked: true, qid: 0, t0: 0, tick: null, startAt: 0
  };

  var TEN = BigInt(10);
  function p10(n){ return TEN ** BigInt(n); }
  function rnd(n){ return Math.floor(Math.random() * n); }

  function randBig(n){
    var s = String(1 + rnd(9));
    for(var i = 1; i < n; i++) s += String(rnd(10));
    return BigInt(s);
  }

  function randBetween(lo, hi){
    var range = hi - lo + BigInt(1);
    if(range <= BigInt(0)) return lo;
    var len = range.toString().length + 3;
    var s = String(1 + rnd(9));
    for(var i = 1; i < len; i++) s += String(rnd(10));
    return lo + (BigInt(s) % range);
  }

  /* ---------------- 出题 ---------------- */
  function genQuestion(){
    var op = S.ops[rnd(S.ops.length)];
    var d = S.digits;
    var a, b, ans;

    if(op === "+"){
      a = randBig(d); b = randBig(d); ans = a + b;
    } else if(op === "−"){
      var loS = p10(d - 1);
      var tries = 0;
      do {
        a = randBig(d);
        if(a <= loS) a = loS + BigInt(1);
        b = randBetween(loS, a - BigInt(1));   // 保证 b 同位数且结果 > 0
        ans = a - b;
        tries++;
      } while(d >= 3 && ans < p10(d - 2) && tries < 8);   // 避免结果过小
    } else if(op === "×"){
      a = randBig(d);
      var bd = d <= 2 ? d : 2;            // 乘数控制位数，避免过于变态
      b = randBig(bd);
      ans = a * b;
    } else {                              // ÷ 保证整除
      var bd2 = Math.min(2, Math.max(1, d - 1));
      b = randBig(bd2);
      var lo = p10(d - 1) / b + BigInt(1);
      var hi = (p10(d) - BigInt(1)) / b;
      if(hi < lo) hi = lo;
      ans = randBetween(lo, hi);
      a = b * ans;
    }
    return { a: a, b: b, op: op, ans: ans };
  }

  function exprText(q){ return q.a + " " + q.op + " " + q.b + " ="; }

  /* ---------------- 视图切换 ---------------- */
  function show(name){
    els.setup.classList.toggle("active", name === "setup");
    els.drill.classList.toggle("active", name === "drill");
    els.done.classList.toggle("active", name === "done");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function toast(msg){
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ els.toast.classList.remove("show"); }, 1400);
  }

  /* ---------------- 训练流程 ---------------- */
  function startRun(queue){
    if(!S.ops.length && !queue){ toast("请至少选择一个算子"); return; }
    S.i = 0; S.ok = 0; S.bad = 0; S.streak = 0; S.maxStreak = 0;
    S.times = []; S.wrong = []; S.queue = queue || null;
    S.startAt = Date.now();
    updateStats();
    show("drill");
    nextQuestion();
  }

  function currentTotal(){
    return S.queue ? S.queue.length : S.total;
  }

  function updateStats(){
    els.okCount.textContent = S.ok;
    els.badCount.textContent = S.bad;
    var done = S.ok + S.bad;
    els.accText.textContent = done ? Math.round(S.ok / done * 100) + "%" : "—";
    els.streakText.textContent = S.streak;
  }

  function updateProgress(){
    var total = currentTotal();
    els.progressText.textContent = (S.i + 1) + (total ? " / " + total : "");
    els.progressBar.style.width = total ? ((S.i / total) * 100) + "%" : "0%";
  }

  function nextQuestion(){
    var total = currentTotal();
    if(S.queue && S.i >= S.queue.length){ finish(); return; }
    if(!S.queue && total && S.i >= total){ finish(); return; }

    S.locked = false;
    S.qid++;
    var q = S.queue ? S.queue[S.i] : genQuestion();
    S.cur = q;

    els.qcard.classList.remove("good", "bad");
    els.qExpr.textContent = exprText(q);
    els.feedback.textContent = "";
    els.feedback.className = "feedback";
    els.answer.value = "";
    els.answer.disabled = false;
    els.answer.focus();
    updateProgress();
    startTimer();
  }

  function startTimer(){
    stopTimer();
    S.t0 = performance.now();
    var limit = S.limit;
    els.timerText.textContent = "0.0s";
    els.timerText.style.color = "";
    S.tick = setInterval(function(){
      var el = (performance.now() - S.t0) / 1000;
      if(limit > 0){
        var left = Math.max(0, limit - el);
        els.timerText.textContent = "剩 " + left.toFixed(1) + "s";
        els.timerText.style.color = left <= 3 ? "var(--bad)" : "";
        if(left <= 0){ resolve(false, null, true); }
      } else {
        els.timerText.textContent = el.toFixed(1) + "s";
      }
    }, 100);
  }

  function stopTimer(){
    if(S.tick){ clearInterval(S.tick); S.tick = null; }
  }

  function submit(){
    if(S.locked) return;
    var raw = els.answer.value.trim().replace(/[,\s]/g, "");
    if(raw === ""){ els.answer.focus(); return; }
    if(!/^-?\d+$/.test(raw)){
      els.feedback.className = "feedback bad";
      els.feedback.textContent = "请输入整数";
      return;
    }
    var val;
    try{ val = BigInt(raw); }catch(e){ return; }
    resolve(val === S.cur.ans, raw, false);
  }

  function resolve(correct, userRaw, timeout){
    if(S.locked) return;
    S.locked = true;
    stopTimer();

    var used = (performance.now() - S.t0) / 1000;
    S.times.push(used);

    var q = S.cur;
    els.answer.disabled = true;

    if(correct){
      S.ok++; S.streak++;
      if(S.streak > S.maxStreak) S.maxStreak = S.streak;
      els.qcard.classList.add("good");
      els.feedback.className = "feedback good";
      els.feedback.textContent = "✔ 正确　" + used.toFixed(1) + "s";
    } else {
      S.bad++; S.streak = 0;
      S.wrong.push({ expr: exprText(q), ans: q.ans.toString(), user: timeout ? "超时" : (userRaw === null ? "跳过" : userRaw) });
      els.qcard.classList.add("bad");
      els.feedback.className = "feedback bad";
      els.feedback.innerHTML = (timeout ? "⏱ 超时" : (userRaw === null ? "— 已跳过" : "✘ 答错了"))
        + '<small>正确答案：' + q.ans.toString() + "</small>";
    }
    updateStats();

    var wait = correct ? 620 : 1500;
    var qid = S.qid;
    setTimeout(function(){
      if(qid !== S.qid) return;
      S.i++;
      nextQuestion();
    }, wait);
  }

  /* ---------------- 结算 ---------------- */
  function fmtTime(sec){
    if(sec == null || !isFinite(sec)) return "—";
    if(sec < 60) return sec.toFixed(1) + "s";
    return Math.floor(sec / 60) + "m" + Math.round(sec % 60) + "s";
  }

  function finish(){
    stopTimer();
    S.locked = true;
    var done = S.ok + S.bad;
    var acc = done ? Math.round(S.ok / done * 100) : 0;
    var avg = S.times.length ? S.times.reduce(function(x, y){ return x + y; }, 0) / S.times.length : null;
    var fast = S.times.length ? Math.min.apply(null, S.times) : null;
    var totalSec = (Date.now() - S.startAt) / 1000;

    els.scoreBig.textContent = acc + "%";
    els.scoreSub.textContent = "答对 " + S.ok + " / " + done + " 题";
    els.kpiAvg.textContent = fmtTime(avg);
    els.kpiStreak.textContent = S.maxStreak;
    els.kpiFast.textContent = fmtTime(fast);
    els.kpiTotal.textContent = fmtTime(totalSec);

    if(S.wrong.length){
      els.wrongCard.style.display = "";
      var html = "";
      for(var i = 0; i < S.wrong.length; i++){
        var w = S.wrong[i];
        html += '<div class="wrong-item"><span>' + w.expr + "</span>"
              + '<span><span class="ai">' + w.user + "</span> → <span class=\"co\">" + w.ans + "</span></span></div>";
      }
      els.wrongList.innerHTML = html;
      els.retryWrongBtn.style.display = "";
    } else {
      els.wrongCard.style.display = "none";
      els.retryWrongBtn.style.display = "none";
    }
    show("done");
  }

  /* ---------------- 设置交互 ---------------- */
  els.opChips.addEventListener("click", function(e){
    var btn = e.target.closest(".chip");
    if(!btn) return;
    var op = btn.getAttribute("data-op");
    var idx = S.ops.indexOf(op);
    if(idx >= 0){ S.ops.splice(idx, 1); btn.classList.remove("on"); }
    else { S.ops.push(op); btn.classList.add("on"); }
    updateHint();
  });

  function updateHint(){
    if(!S.ops.length){ els.hint.textContent = "⚠ 请至少选择一个算子"; return; }
    var t = "出题规则：" + S.ops.join(" ") + " · 每题数字 " + S.digits + " 位";
    if(S.ops.indexOf("÷") >= 0) t += " · 除法保证整除";
    if(S.ops.indexOf("−") >= 0) t += " · 减法不出现负数";
    els.hint.textContent = t;
  }

  function setFill(node){
    var min = +node.min, max = +node.max, v = +node.value;
    node.style.setProperty("--p", ((v - min) / (max - min) * 100) + "%");
  }

  els.digits.addEventListener("input", function(){
    S.digits = +els.digits.value;
    els.digitsVal.textContent = S.digits + " 位";
    setFill(els.digits);
    updateHint();
  });

  els.totalSeg.addEventListener("click", function(e){
    var b = e.target.closest("button[data-v]");
    if(!b) return;
    var btns = els.totalSeg.querySelectorAll("button");
    for(var i = 0; i < btns.length; i++) btns[i].classList.remove("on");
    b.classList.add("on");
    S.total = +b.getAttribute("data-v");
    els.totalVal.textContent = S.total ? S.total + " 题" : "无限";
  });

  els.limitSeg.addEventListener("click", function(e){
    var b = e.target.closest("button[data-v]");
    if(!b) return;
    var btns = els.limitSeg.querySelectorAll("button");
    for(var i = 0; i < btns.length; i++) btns[i].classList.remove("on");
    b.classList.add("on");
    S.limit = +b.getAttribute("data-v");
    els.limitVal.textContent = S.limit ? S.limit + " 秒" : "不限时";
  });

  els.startBtn.addEventListener("click", function(){ startRun(null); });
  els.submitBtn.addEventListener("click", submit);
  els.skipBtn.addEventListener("click", function(){ if(!S.locked) resolve(false, null, false); });
  els.quitBtn.addEventListener("click", finish);
  els.againBtn.addEventListener("click", function(){ startRun(null); });
  els.backBtn.addEventListener("click", function(){ show("setup"); });

  els.retryWrongBtn.addEventListener("click", function(){
    var qs = S.wrong.map(function(w){
      var m = w.expr.match(/^(\S+)\s+([+\-−×÷])\s+(\S+)\s*=/);
      if(!m) return null;
      var a = BigInt(m[1]), b = BigInt(m[3]), op = m[2];
      var ans = op === "+" ? a + b : op === "−" ? a - b : op === "×" ? a * b : a / b;
      return { a: a, b: b, op: op, ans: ans };
    }).filter(Boolean);
    if(!qs.length){ toast("没有可重练的错题"); return; }
    startRun(qs);
  });

  els.answer.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); submit(); }
  });

  els.themeBtn.addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
    var next = cur === "light" ? "dark" : "light";
    document.documentElement.setAttribute("data-theme", next);
    els.themeBtn.textContent = next === "light" ? "☀️" : "🌙";
    try{ localStorage.setItem("drill.theme", next); }catch(e){}
  });

  /* ---------------- 初始化 ---------------- */
  (function init(){
    var saved = null;
    try{ saved = localStorage.getItem("drill.theme"); }catch(e){}
    if(saved === "light"){
      document.documentElement.setAttribute("data-theme", "light");
      els.themeBtn.textContent = "☀️";
    }
    S.digits = +els.digits.value;
    els.digitsVal.textContent = S.digits + " 位";
    setFill(els.digits);
    updateHint();
  })();
})();
</script>
</body>
</html>
